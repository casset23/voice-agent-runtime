[supervisord]
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=true

[program:agent-gateway]
command=/app/app/agent-gateway/target/release/agent-gateway
environment=ENV="local"
directory=/app/app/agent-gateway
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
priority=100
startsecs=3

[program:llm-runner]
command=/bin/bash -lc "sleep 10 && python -m uvicorn app.main:app --host 0.0.0.0 --port 30011"
directory=/app/app/llm-runner
environment=RESOURCE_REGISTRY_BASE_URL="http://localhost:30013"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
priority=300
startsecs=12

[program:dashboard]
command=/bin/bash -lc "sleep 15 && pnpm dev -- --host 0.0.0.0 --port 30012"
directory=/app/app/dashboard
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
priority=400

[program:resource-registry]
command=/bin/bash -lc "sleep 5 && HOST=0.0.0.0 PORT=30013 pnpm start:dev"
directory=/app/app/resource-registry
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
priority=200
startsecs=8

[program:tool-weather]
command=python app/main.py
directory=/app/tools/tool-weather
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:tool-datetime]
command=python app/main.py
directory=/app/tools/tool-datetime
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:tool-music]
command=python main.py
directory=/app/tools/tool-music
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

[program:tool-content]
command=python main.py
directory=/app/tools/tool-content
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0

apiVersion: apps/v1
kind: Deployment
metadata:
    name: auth
    labels:
      app.kubernetes.io/name: auth
spec:
    replicas: 2
    selector:
        matchLabels:
            app.kubernetes.io/name: auth
    template:
        metadata:
            labels:
                app.kubernetes.io/name: auth
        spec:
            containers:
                - name: auth
                  image: ghcr.io/casset23/auth:0.1.0
                  ports:
                      - containerPort: 3000
                  env:
                    - name: ENV
                      value: production
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 3000
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 3000
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  resources:
                      requests:
                        cpu: "250m"
                        memory: "128Mi"
                      limits:
                        cpu: "500m"
                        memory: "256Mi"
            imagePullSecrets:
                - name: ghcr-secret

---
apiVersion: v1
kind: Service
metadata:
    name: auth
spec:
    selector:
        app.kubernetes.io/name: auth
    ports:
        - port: 80
          targetPort: 3000
    type: ClusterIP
apiVersion: apps/v1
kind: Deployment
metadata:
    name: agent-gateway
    labels:
      app.kubernetes.io/name: agent-gateway
spec:
    replicas: 2
    selector:
        matchLabels:
            app.kubernetes.io/name: agent-gateway
    template:
        metadata:
            labels:
                app.kubernetes.io/name: agent-gateway
        spec:
            containers:
                - name: agent-gateway
                  image: ghcr.io/casset23/agent-gateway:0.1.0
                  ports:
                      - containerPort: 3456
                  env:
                    - name: ENV
                      value: production
                    - name: RUST_LOG
                      value: info
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 3456
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 3456
                      initialDelaySeconds: 5
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  resources:
                      requests:
                        cpu: "500m"
                        memory: "256Mi"
                      limits:
                        cpu: "1"
                        memory: "512Mi"
            imagePullSecrets:
                - name: ghcr-secret

---
apiVersion: v1
kind: Service
metadata:
    name: agent-gateway
spec:
    selector:
        app.kubernetes.io/name: agent-gateway
    ports:
        - port: 80
          targetPort: 3456
    type: ClusterIP
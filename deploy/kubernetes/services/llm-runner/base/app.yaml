apiVersion: apps/v1
kind: Deployment
metadata:
    name: llm-runner
    labels:
      app.kubernetes.io/name: llm-runner
spec:
    replicas: 2
    selector:
        matchLabels:
            app.kubernetes.io/name: llm-runner
    template:
        metadata:
            labels:
                app.kubernetes.io/name: llm-runner
        spec:
            containers:
                - name: llm-runner
                  image: ghcr.io/casset23/llm-runner:0.1.0
                  ports:
                      - containerPort: 8000
                  env:
                    - name: APP_ENV
                      value: production
                    - name: PYTHONPATH
                      value: "/app"
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 11001
                      initialDelaySeconds: 60
                      periodSeconds: 30
                      timeoutSeconds: 10
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 11001
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  resources:
                      requests:
                        cpu: "1"
                        memory: "1Gi"
                      limits:
                        cpu: "2"
                        memory: "2Gi"
            imagePullSecrets:
                - name: ghcr-secret

---
apiVersion: v1
kind: Service
metadata:
    name: llm-runner
spec:
    selector:
        app.kubernetes.io/name: llm-runner
    ports:
        - port: 80
          targetPort: 11001
    type: ClusterIP
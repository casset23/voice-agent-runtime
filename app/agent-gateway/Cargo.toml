[package]
name = "agent-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "^1.0"
axum = "^0.8.4"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
tokio = { version = "^1", features = ["full"] }
tracing = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }
reqwest = { version = "^0.12", features = ["json"] }
axum-server = "0.7"
utoipa = "5"
uuid = { version = "^1.17", features = ["v4"] }

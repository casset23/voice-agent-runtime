name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python-original-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-public-check.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app/llm-runner tools
  rust-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/agent-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/agent-gateway
      - run: cargo check --locked
      - run: cargo test --locked
  typescript-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@10.12.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: app/dashboard
      - run: pnpm run build
        working-directory: app/dashboard
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: app/resource-registry
      - run: pnpm run build
        working-directory: app/resource-registry
      - run: pnpm exec jest --runInBand
        working-directory: app/resource-registry
